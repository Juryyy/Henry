services:
  henry:
    build: .
    restart: unless-stopped
    ports:
      - '8080:8080'
    env_file:
      - .env
    environment:
      # Aby logy a časy notifikací seděly s TZ_NAME.
      TZ: ${TZ_NAME:-Europe/Prague}
    volumes:
      - henry-data:/app/data
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  henry-data:
