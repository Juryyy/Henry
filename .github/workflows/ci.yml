name: Testy

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  app:
    name: Aplikace
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Kontrola typů
        run: npm run typecheck

      - name: Jednotkové testy
        run: npm test

      - name: Prohlížeč pro e2e
        run: npx playwright install --with-deps chromium

      - name: E2E testy
        run: npm run e2e

      - name: Výsledky e2e při chybě
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-vysledky
          path: app/test-results
          retention-days: 7

  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Kontrola typů
        run: npm run typecheck

      - name: Testy
        run: npm test

      - name: Build
        run: npm run build

  image:
    name: Obraz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sestavení obrazu je jediné místo, kde se ověří, že appka i server jdou
      # přeložit dohromady a že Dockerfile sedí. Nikam se nepushuje.
      - name: Build obrazu
        run: docker build -t henry:ci .

      - name: Server v obrazu naběhne a servíruje appku
        run: |
          docker run -d --name henry-ci -p 8099:8080 \
            -e VAPID_PUBLIC_KEY=BPS6uSuDyUO-KuTrjKpCZ7SQAeliy0UcX2E7yO1DS2Z0n3vSjwBiUOgZPpfRHkV9Qrkv9rLSoK-p4NNwU4BLZVg \
            -e VAPID_PRIVATE_KEY=fEHGWtbywMmEOoCwvrXXOBcgz12PbgkunlLqumJ_ifY \
            -e VAPID_SUBJECT=mailto:ci@example.com \
            -e SECURE_COOKIES=off -e SCHEDULER=off \
            henry:ci

          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8099/api/health > /dev/null && break
            sleep 1
          done

          curl -sf http://127.0.0.1:8099/api/health | grep -q '"ok":true'
          curl -sf http://127.0.0.1:8099/ | grep -q '<title>Henry</title>'
          # Bez přihlášení se k datům nikdo nedostane.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/api/state)" = "401"
          # Doména pro Face ID se bere z adresy požadavku, ne z konfigurace.
          curl -sf -X POST -H 'Host: henry.example.com' \
            http://127.0.0.1:8099/api/auth/passkey/login/options | grep -q '"rpId":"henry.example.com"'

      # Cesta z návodu: zkopírovat `.env.example`, doplnit klíče, `up -d`.
      # Jede zvlášť od `docker run` výš, protože compose skládá prostředí
      # jinak – proměnná z `.env` přebije hodnotu z obrazu, což už jednou
      # způsobilo, že server servíroval jen API a appka končila 404.
      - name: Nasazení podle návodu (docker compose)
        run: |
          docker rm -f henry-ci || true
          cp .env.example .env
          sed -i "s|^VAPID_PUBLIC_KEY=.*|VAPID_PUBLIC_KEY=BPS6uSuDyUO-KuTrjKpCZ7SQAeliy0UcX2E7yO1DS2Z0n3vSjwBiUOgZPpfRHkV9Qrkv9rLSoK-p4NNwU4BLZVg|" .env
          sed -i "s|^VAPID_PRIVATE_KEY=.*|VAPID_PRIVATE_KEY=fEHGWtbywMmEOoCwvrXXOBcgz12PbgkunlLqumJ_ifY|" .env
          sed -i "s|^SECURE_COOKIES=.*|SECURE_COOKIES=off|" .env
          docker compose up -d

          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/api/health > /dev/null && break
            sleep 1
          done

          # Appka se musí servírovat, ne jen API.
          curl -sf http://127.0.0.1:8080/ | grep -q '<title>Henry</title>'
          # A databáze musí jít otevřít – jinak by první registrace spadla.
          curl -sf http://127.0.0.1:8080/api/health | grep -q '"registrationOpen":true'
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"dost-dlouhe-heslo"}' \
            http://127.0.0.1:8080/api/auth/register | grep -q '"first":true'

      - name: Logy při chybě
        if: failure()
        run: docker logs henry-ci || docker compose logs
