name: Testy

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  app:
    name: Aplikace
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Kontrola typů
        run: npm run typecheck

      - name: Jednotkové testy
        run: npm test

      - name: Prohlížeč pro e2e
        run: npx playwright install --with-deps chromium

      - name: E2E testy
        run: npm run e2e

      - name: Výsledky e2e při chybě
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-vysledky
          path: app/test-results
          retention-days: 7

  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Kontrola typů
        run: npm run typecheck

      - name: Testy
        run: npm test

      - name: Build
        run: npm run build
